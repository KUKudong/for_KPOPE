<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<title>모의 거래소 (교육용 데모)</title>
<style>
  :root {
    --bg: #0b1120; --panel: #111a2e; --line: #1b2439; --text: #e8ecf3; --sub: #7f8aa3;
    --blue: #1261e6; --navy: #093687; --up: #e0454d; --down: #3b82f6; --warn: #f5a524;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05080f; color: var(--text);
    font-family: Roboto, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; letter-spacing: -0.2px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  #app { max-width: 480px; height: 100%; margin: 0 auto; background: var(--bg);
    display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .demo-bar { background: var(--warn); color: #1a1200; font-size: 12px; font-weight: 700;
    text-align: center; padding: 5px 8px; flex: none; }
  #view { flex: 1; overflow-y: auto; }
  .tabbar { flex: none; display: flex; background: var(--navy); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar button { flex: 1; padding: 10px 0 9px; font-size: 12px; color: #a9bbe6; }
  .tabbar button.on { color: #fff; font-weight: 700; }
  .tabbar .ico { display: block; height: 24px; margin-bottom: 3px; } .sico { display: flex; color: #dfe4ee; }
  .head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; font-size: 19px; font-weight: 700; }
  .head .back { font-size: 22px; padding: 0 6px 0 0; }
  .sub { color: var(--sub); } .up { color: var(--up); } .down { color: var(--down); }
  .right { text-align: right; } .small { font-size: 12px; } .mt { margin-top: 12px; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; padding: 10px 16px;
    background: var(--panel); font-size: 13px; }
  .summary div { display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .row .name { flex: 1.5; } .row .name b { display: block; font-weight: 500; font-size: 15px; }
  .row .col { flex: 1; text-align: right; font-size: 14px; }
  .thead { display: flex; padding: 8px 16px; font-size: 12px; color: var(--sub); border-bottom: 1px solid var(--line); }
  .thead span { flex: 1; text-align: right; } .thead span:first-child { flex: 1.5; text-align: left; }
  .coin { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 800; color: #fff; margin-right: 12px; flex: none; }
  .pad { padding: 16px; }
  .big { font-size: 28px; font-weight: 800; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 6px; background: var(--blue);
    color: #fff; font-weight: 700; font-size: 16px; text-align: center; }
  .btn.ghost { background: #16264a; color: #8fb4ff; } .btn.red { background: var(--up); }
  .btn.sell { background: var(--down); } .btn:disabled { opacity: .4; cursor: default; }
  .btns { display: flex; gap: 10px; }
  label.f { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 6px; }
  input.in, select.in { width: 100%; padding: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; font-size: 16px; outline: none; }
  input.in:focus, select.in:focus { border-color: var(--blue); }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chips button { flex: 1; padding: 8px 4px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; font-size: 13px; white-space: nowrap; }
  .note { background: #14203b; border-left: 3px solid var(--warn); padding: 10px 12px; font-size: 13px;
    line-height: 1.55; border-radius: 0 4px 4px 0; margin-top: 14px; color: #cfd8ea; }
  .note b { color: #ffd27a; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; }
  .err { color: #ff8088; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .seg { display: flex; border-bottom: 1px solid var(--line); }
  .seg button { flex: 1; padding: 12px; color: var(--sub); font-weight: 700; border-bottom: 2px solid transparent; }
  .seg button.on.buy { color: var(--up); border-color: var(--up); }
  .seg button.on.sell { color: var(--down); border-color: var(--down); }
  .seg button.on { color: #fff; border-color: var(--blue); }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 6px 0; line-height: 1.4; }
  .check input { margin-top: 3px; width: 16px; height: 16px; flex: none; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 3px; background: #3a2a10; color: #ffb866; }
  .badge.ok { background: #10331f; color: #5fd38d; }
  .mission li { padding: 8px 0; list-style: none; font-size: 14px; } .mission { padding: 0; margin: 0; }
  .mission .done { color: #5fd38d; } .mono { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
  .top { display: flex; align-items: center; justify-content: center; padding: 12px 16px 8px; position: relative; min-height: 54px; }
  .top .title { position: absolute; left: 16px; font-size: 20px; font-weight: 700; }
  .top .tools { position: absolute; right: 12px; display: flex; gap: 10px; } .top .tools button { color: #e3e7ef; display: flex; padding: 0; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 16px; }
  .pill b { background: #e6e9ef; color: #0b1120; padding: 6px 16px; border-radius: 18px; }
  .pill button { padding: 6px 14px; color: #c9d2e6; }
  .search { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 2px solid #c9d2e6; }
  .search input { flex: 1; background: none; border: 0; outline: none; font-size: 16px; min-width: 0; }
  .search select { background: var(--panel); border: 0; border-radius: 4px; padding: 8px 10px; }
  .mtabs { display: inline-flex; margin: 10px 16px; border: 1px solid #2b3653; border-radius: 4px; overflow: hidden; }
  .mtabs button { padding: 7px 14px; color: var(--sub); border-right: 1px solid #2b3653; font-size: 15px; }
  .mtabs button:last-child { border-right: 0; } .mtabs button.on { color: #3b8bff; box-shadow: inset 0 0 0 1px #3b8bff; }
  .mrow { padding: 10px 12px; align-items: flex-start; } .mrow .name { flex: 1.5; } .mrow .col { font-size: 14px; }
  .mrow .vol { font-size: 13px; color: #d5dbe8; } .thead { padding: 8px 12px; } .thead span:first-child { padding-left: 16px; }
  .cdl { width: 9px; height: 28px; margin: 2px 7px 0 0; flex: none; background: linear-gradient(#2a3550, #2a3550) center/1px 100% no-repeat; position: relative; }
  .cdl::after { content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: #8892a8; }
  .cdl.up::after { top: 6px; height: 14px; background: var(--up); } .cdl.down::after { top: 10px; height: 12px; background: var(--down); }
  .chev { color: var(--sub); margin-left: 10px; font-size: 18px; }
  .sub5 button { padding: 10px 0; font-size: 14px; }
  .ogrid { display: grid; grid-template-columns: 40% 60%; border-bottom: 1px solid var(--line); }
  #ob { border-right: 1px solid var(--line); font-size: 12px; }
  .ob { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid var(--bg); min-height: 36px; }
  .ob.a { background: #0f1d3a; } .ob.b { background: #2a1420; } .ob i { font-style: normal; font-size: 10px; opacity: .8; }
  .ob em { font-style: normal; color: #aab3c8; font-size: 11px; } .ob span { font-weight: 600; }
  .oform { padding: 0 10px 12px; min-width: 0; } .oform .seg { margin: 0 -10px 8px; } .oform .chips button { font-size: 12px; padding: 7px 2px; }
  .oform .in { padding: 10px; } .oform .btn { padding: 12px; }
  .radios { display: flex; gap: 10px; font-size: 12px; color: var(--sub); padding: 4px 0 6px; white-space: nowrap; } .radios .on { color: #fff; }
  .btn.gray { background: #5b6478; flex: 1; }
  .pinlink { margin-top: auto; text-decoration: underline; font-size: 14px; opacity: .85; padding-bottom: 26px; }
  /* PIN */
  #pin { position: absolute; inset: 0; background: var(--navy); z-index: 10; display: flex; flex-direction: column;
    align-items: center; padding: 60px 0 20px; }
  #pin h2 { margin: 30px 0 6px; font-weight: 700; } .dots { display: flex; gap: 14px; margin: 24px 0; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; background: #2a4c95; } .dots i.on { background: #fff; }
  .logo { font-weight: 900; font-style: italic; font-size: 30px; letter-spacing: 1px; }
  .logo small { display: block; font-style: normal; font-size: 12px; font-weight: 600; text-align: center; opacity: .8; }
  .keys { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
  .keys button { padding: 20px 0; font-size: 24px; color: #fff; }
  .toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: #0a1a3d;
    border: 1px solid #25407c; padding: 10px 18px; border-radius: 22px; font-size: 14px; z-index: 20;
    white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="app">
  <div class="demo-bar">⚠ 교육용 모의 앱 · 실제 업비트가 아니며 실제 돈·코인이 오가지 않습니다</div>
  <div id="view"></div>
  <nav class="tabbar" id="tabbar"></nav>
  <div id="pin"></div>
</div>
<script>
"use strict";
/* ============================================================
   모의 거래소 (교육용 데모)
   - 실제 거래소와 연결되지 않습니다. 모든 시세·잔고·주소·TXID는 가상입니다.
   - 상태는 이 브라우저의 localStorage 에만 저장됩니다.
   ============================================================ */
const KEY = "mockExchangeDemo.v1";
const FEE_RATE = 0.0005;      // 거래 수수료 0.05% (예시)
const MIN_ORDER = 5000;       // 최소 주문 금액 (예시)

// 가상 시세의 시작값과 네트워크 정보. 수수료는 학습용 예시 값입니다.
const COINS = [
  { s: "USDT", v: 114698, n: "테더", c: "#26a17b", p: 1359, nets: [
      { id: "TRC20", label: "Tron (TRC20)", fee: 1, re: /^T[1-9A-HJ-NP-Za-km-z]{33}$/ },
      { id: "ERC20", label: "Ethereum (ERC20)", fee: 8, re: /^0x[0-9a-fA-F]{40}$/ } ] },
  { s: "XRP", v: 89930, n: "엑스알피(리플)", c: "#3a4250", p: 1326, tag: true, nets: [
      { id: "XRP", label: "XRP Ledger", fee: 1, re: /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/ } ] },
  { s: "TRX", v: 8204, n: "트론", c: "#c23631", p: 412, nets: [
      { id: "TRC20", label: "Tron (TRC20)", fee: 1, re: /^T[1-9A-HJ-NP-Za-km-z]{33}$/ } ] },
  { s: "BTC", v: 88628, n: "비트코인", c: "#f7931a", p: 88429000, nets: [
      { id: "BTC", label: "Bitcoin", fee: 0.0008, re: /^(bc1[0-9a-z]{25,60}|[13][1-9A-HJ-NP-Za-km-z]{25,34})$/ } ] },
  { s: "ETH", v: 49364, n: "이더리움", c: "#627eea", p: 2482000, nets: [
      { id: "ERC20", label: "Ethereum (ERC20)", fee: 0.009, re: /^0x[0-9a-fA-F]{40}$/ } ] },
  { s: "SOL", v: 26799, n: "솔라나", c: "#7c4dff", p: 100400, nets: [
      { id: "SOL", label: "Solana", fee: 0.01, re: /^[1-9A-HJ-NP-Za-km-z]{32,44}$/ } ] },
  { s: "DOGE", v: 10129, n: "도지코인", c: "#b59a30", p: 80.9, nets: [
      { id: "DOGE", label: "Dogecoin", fee: 4, re: /^D[1-9A-HJ-NP-Za-km-z]{33}$/ } ] },
];
const coin = s => COINS.find(c => c.s === s);
const price = {}, base = {};
COINS.forEach(c => { base[c.s] = c.p; price[c.s] = c.p * (1 + (Math.random() - .5) * .03); });

/* ---------- 상태 ---------- */
const fresh = () => ({ krw: 0, bal: {}, hist: [], deposited: false, bought: false, withdrew: false });
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { S = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const qty = s => (S.bal[s] ? S.bal[s].q : 0);
const log = (type, sym, q, krw, memo) => { S.hist.unshift({ t: Date.now(), type, sym, q, krw, memo: memo || "" }); S.hist = S.hist.slice(0, 200); };

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const won = v => Math.floor(v).toLocaleString("ko-KR");
const fp = v => v >= 100 ? Math.round(v).toLocaleString("ko-KR") : v >= 1 ? v.toFixed(1) : v.toFixed(3);
const fd = v => (v > 0 ? "+" : v < 0 ? "-" : "") + fp(Math.abs(v));
const fq = v => (+(+v).toFixed(8)).toLocaleString("ko-KR", { maximumFractionDigits: 8 });
const num = v => { const n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : 0; };
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const rnd = (n, abc) => Array.from({ length: n }, () => abc[Math.floor(Math.random() * abc.length)]).join("");
function sampleAddr(net) {
  switch (net) {
    case "TRC20": return "T" + rnd(33, B58);
    case "ERC20": return "0x" + rnd(40, "0123456789abcdef");
    case "XRP": return "r" + rnd(33, B58);
    case "BTC": return "bc1q" + rnd(38, "023456789acdefghjklmnpqrstuvwxyz");
    case "SOL": return rnd(44, B58);
    case "DOGE": return "D" + rnd(33, B58);
  }
  return "";
}
let toastT;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; $("app").appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2200);
}
const icon = c => `<span class="coin" style="background:${c.c}">${c.s.slice(0, 4)}</span>`;
const totalEval = () => COINS.reduce((a, c) => a + qty(c.s) * price[c.s], 0);
const totalBuy = () => COINS.reduce((a, c) => a + (S.bal[c.s] ? S.bal[c.s].q * S.bal[c.s].avg : 0), 0);

/* ---------- 라우터 ---------- */
let route = { tab: "market" };
const IC = {
  market: '<path d="M4 20V10l8-6 8 6v10z"/><path d="M8 16l3-3 2 2 3-4"/>',
  info: '<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9 16v-4M12 16V8M15 16v-6"/>',
  history: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 10h7M9 14h7M9 18h4"/>',
  wallet: '<path d="M4 8h15l-3-3M20 16H5l3 3"/>',
  more: '<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M17 14v6M14 17h6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5l1.6 2.6 3-.6.6 3 2.6 1.6-1.4 2.9 1.4 2.9-2.6 1.6-.6 3-3-.6-1.6 2.6-1.6-2.6-3 .6-.6-3-2.6-1.6L5.6 12 4.2 9.100l2.6-1.6.6-3 3 .6z"/>',
  chat: '<path d="M4 4h16v12H10l-6 4z"/><path d="M8 8h8M8 12h5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
};
const svg = (k, s) => `<svg width="${s || 24}" height="${s || 24}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const TOOLS = `<span class="tools"><button data-go="more">${svg("gear", 26)}</button><button data-soon>${svg("chat", 26)}</button></span>`;
const TABS = [["market", "", "거래소"], ["info", "", "코인정보"], ["history", "", "투자내역"], ["wallet", "", "입출금"], ["more", "", "더보기"]];
function go(r) { route = r; render(); $("view").scrollTop = 0; }
function render() {
  $("tabbar").innerHTML = TABS.map(([k, i, l]) =>
    `<button class="${route.tab === k ? "on" : ""}" data-go="${k}"><span class="ico">${svg(k)}</span>${l}</button>`).join("");
  const v = $("view");
  if (route.page === "order") v.innerHTML = vOrder();
  else if (route.page === "krw") v.innerHTML = vKrw();
  else if (route.page === "asset") v.innerHTML = vAsset();
  else if (route.page === "withdraw") v.innerHTML = vWithdraw();
  else if (route.page === "result") v.innerHTML = vResult();
  else v.innerHTML = ({ market: vMarket, info: vInfo, history: vHistory, wallet: vWallet, more: vMore })[route.tab]();
  if (route.page === "order") calcOrder();
  if (route.page === "withdraw") calcWd();
}

/* ---------- 거래소 ---------- */
function chg(s) { const d = price[s] - base[s]; return { d, pct: d / base[s] * 100, cls: d > 0 ? "up" : d < 0 ? "down" : "" }; }
const match = (c, q) => !q || c.n.toLowerCase().includes(q) || c.s.toLowerCase().includes(q);
function marketRows() {
  const q = (route.q || "").trim().toLowerCase(), list = COINS.filter(c => match(c, q));
  if (!list.length) return `<div class="pad sub">검색 결과가 없습니다.</div>`;
  return list.map(c => { const g = chg(c.s); return `<button class="row mrow" data-order="${c.s}">
    <span class="cdl ${g.cls}" data-k="${c.s}"></span>
    <span class="name"><b>${c.n}</b><span class="sub small">${c.s}/KRW</span></span>
    <span class="col ${g.cls}" data-p="${c.s}">${fp(price[c.s])}</span>
    <span class="col ${g.cls}"><span data-c="${c.s}">${g.pct.toFixed(2)}%</span><br><span class="small" data-d="${c.s}">${fd(g.d)}</span></span>
    <span class="col vol">${c.v.toLocaleString("ko-KR")}<span class="small">백만</span></span></button>`; }).join("");
}
function vMarket() {
  const ev = totalEval(), by = totalBuy(), pl = ev - by, r = by ? pl / by * 100 : 0, cls = pl > 0 ? "up" : pl < 0 ? "down" : "";
  return `<div class="top"><span class="pill"><b>거래소</b><button data-soon>NFT</button></span>
    ${TOOLS}</div>
  <div class="search"><span class="sico">${svg("search", 22)}</span><input id="m-q" placeholder="코인명/심볼 검색" value="${esc(route.q || "")}" autocomplete="off"></div>
  <div class="summary">
    <div><span class="sub">총 매수</span><span>${won(by)}</span></div>
    <div><span class="sub">평가손익</span><span id="m-pl" class="${cls}">${won(pl)}</span></div>
    <div><span class="sub">총 평가</span><span id="m-ev">${won(ev)}</span></div>
    <div><span class="sub">수익률</span><span id="m-r" class="${cls}">${r.toFixed(2)}%</span></div>
  </div>
  <div class="mtabs"><button class="on">KRW</button><button data-soon>BTC</button><button data-soon>USDT</button><button data-soon>관심</button></div>
  <div class="thead"><span>한글명 ⇄</span><span>현재가 ⇅</span><span>전일대비 ⇅</span><span>거래대금 ⇅</span></div>
  <div id="m-list">${marketRows()}</div>
  <div class="pad sub small">시세·거래대금은 무작위로 움직이는 가상 값이며 실제 시장과 무관합니다.</div>`;
}

/* ---------- 코인정보 ---------- */
function vInfo() {
  return `<div class="head">코인정보</div>
  <div class="pad sub small" style="padding-top:0">코인마다 출금에 쓰는 네트워크와 수수료가 다릅니다. 보내는 쪽과 받는 쪽 네트워크가 같아야 합니다.</div>
  ${COINS.map(c => `<button class="row" data-order="${c.s}">${icon(c)}
    <span class="name"><b>${c.n} <span class="sub small">${c.s}</span></b>
      <span class="sub small">${c.nets.map(n => `${n.label} · 수수료 ${fq(n.fee)} ${c.s}`).join("<br>")}</span></span>

    return `<div class="ob ${k}"><span class="${cl}">${fp(x)}<br><i>${pc.toFixed(2)}%</i></span><em>${fq((Math.random() * 90000 / p * 1000 + 1).toFixed(3))}</em></div>`; };
  let h = ""; for (let i = 6; i >= 1; i--) h += row(p + step * i, "a");
  for (let i = 1; i <= 6; i++) h += row(p - step * (i - 1), "b"); return h;
}

function orderVals() {

}

  const o = orderVals(), e = $("o-err");
  if (!o.a || o.a <= 0) return e.textContent = "금액(수량)을 입력하세요.";
  if (o.side === "buy") {
    if (o.a < MIN_ORDER) return e.textContent = `최소 주문 금액은 ${won(MIN_ORDER)}원입니다.`;
    if (o.a > S.krw) return e.textContent = "주문가능 금액이 부족합니다. 먼저 KRW를 입금하세요.";
    const b = S.bal[o.c.s] || { q: 0, avg: 0 };
    b.avg = (b.q * b.avg + o.a) / (b.q + o.q); b.q += o.q; S.bal[o.c.s] = b; S.krw -= o.a; S.bought = true;
    log("매수", o.c.s, o.q, o.a);
  } else {
    if (o.a > qty(o.c.s) + 1e-12) return e.textContent = "보유 수량이 부족합니다.";
    if (o.a * o.p < MIN_ORDER) return e.textContent = `최소 주문 금액은 ${won(MIN_ORDER)}원입니다.`;
    S.bal[o.c.s].q = Math.max(0, S.bal[o.c.s].q - o.a); if (S.bal[o.c.s].q < 1e-8) delete S.bal[o.c.s];
    S.krw += o.krw; log("매도", o.c.s, o.q, o.krw);
  }
  save(); toast(`${o.c.s} ${o.side === "buy" ? "매수" : "매도"} 체결`); render();
}

  S.hist.forEach(h => {
    if (h.tx && !h.tx.done) {
      const left = 6000 - (Date.now() - h.tx.t);
      if (left <= 0) { h.tx.done = true; changed = true; }
      else setTimeout(settle, left + 50);
    }
  });
  if (changed) { save(); if (route.page === "result" || route.page === "asset" || route.tab === "history") render(); }
}

  const held = COINS.filter(c => qty(c.s) > 0);
  return `<div class="head">투자내역</div>
  <div class="thead"><span>보유자산</span><span>평가금액</span><span>수익률</span></div>
  ${held.length ? held.map(c => { const b = S.bal[c.s], ev = b.q * price[c.s], r = (price[c.s] / b.avg - 1) * 100;
    return `<button class="row" data-asset="${c.s}">${icon(c)}<span class="name"><b>${c.n}</b><span class="sub small">${fq(b.q)} ${c.s}</span></span>
      <span class="col">${won(ev)}</span><span class="col ${r > 0 ? "up" : r < 0 ? "down" : ""}">${r.toFixed(2)}%</span></button>`; }).join("")
    : `<div class="pad sub">보유 중인 코인이 없습니다.</div>`}
  <div class="thead mt"><span>거래내역</span><span>수량/금액</span><span>상태</span></div>
  ${S.hist.length ? S.hist.map(histRow).join("") : `<div class="pad sub">거래내역이 없습니다.</div>`}`;
}

/* ---------- 더보기 ---------- */
function vMore() {
  const m = [[S.deposited, "모의 은행에서 KRW 입금하기", "입출금 → KRW 입금"],
    [S.bought, "전송에 쓸 코인 매수하기", "거래소 → 코인 선택 → 매수 (XRP·TRX·USDT 추천)"],
    [S.withdrew, "모의 바이낸스 입금 주소로 출금하기", "입출금 → 코인 → 출금하기 (네트워크·주소·태그 확인)"],
    [S.hist.some(h => h.tx && h.tx.done), "출금 완료 확인하고 TXID 살펴보기", "투자내역에서 출금 건을 눌러 보세요"]];
  return `<div class="head">더보기</div>
  <div class="pad" style="padding-top:0">
    <h3 style="margin:0 0 6px">학습 미션: 은행 → 국내 거래소 → 해외 거래소</h3>
    <ul class="mission">${m.map(([ok, t, d], i) => `<li class="${ok ? "done" : ""}">${ok ? "✅" : "⬜"} ${i + 1}. ${t}<br><span class="sub small">　 ${d}</span></li>`).join("")}</ul>
    <div class="note"><b>이 앱에 대해</b><br>
      학생들의 모의투자 수업을 위한 <b>교육용 시뮬레이터</b>입니다. 업비트(두나무)와 아무 관련이 없는 비공식 연습 도구이며,
      실제 계좌·거래소·블록체인과 연결되지 않습니다. 시세, 잔고, 주소, TXID는 모두 가상이고 이 기기의 브라우저에만 저장됩니다.
      <b>실제 비밀번호·PIN·계좌번호·지갑 주소를 입력하지 마세요.</b><br><br>
      실제 가상자산 거래는 원금 손실 위험이 크고, 국내 거래소는 만 19세 이상 본인 명의 계좌로만 이용할 수 있습니다.</div>
    <div class="mt"><button class="btn ghost" id="reset">모의 데이터 초기화</button></div>
  </div>`;
}

/* ---------- PIN (연습용) ---------- */
let pinBuf = "";
function drawPin() {
  const ks = "0123456789".split("").sort(() => Math.random() - .5);
  $("pin").innerHTML = `<div class="logo">MOCK EX<small>교육용 모의 거래소</small></div>
    <h2>PIN 비밀번호 입력</h2>
    <div class="dots" id="dots">${"<i></i>".repeat(6)}</div>
    <div class="small" style="opacity:.8;text-align:center;padding:0 24px">아무 숫자 6자리나 누르면 들어갑니다.<br>실제로 쓰는 PIN·비밀번호는 입력하지 마세요.</div>
    <div class="pinlink">PIN 비밀번호를 잊으셨나요?</div>
    <div class="keys">${ks.slice(0, 9).map(k => `<button data-k="${k}">${k}</button>`).join("")}
      <button></button><button data-k="${ks[9]}">${ks[9]}</button><button data-k="del">⌫</button></div>`;
}
$("pin").addEventListener("click", ev => {
  const b = ev.target.closest("[data-k]"); if (!b) return;
  pinBuf = b.dataset.k === "del" ? pinBuf.slice(0, -1) : pinBuf + b.dataset.k;
  [...$("dots").children].forEach((d, i) => d.classList.toggle("on", i < pinBuf.length));
  if (pinBuf.length >= 6) { pinBuf = ""; setTimeout(() => { $("pin").style.display = "none"; }, 150); } // PIN은 저장·검증하지 않음
});

/* ---------- 이벤트 ---------- */
$("tabbar").addEventListener("click", ev => { const b = ev.target.closest("[data-go]"); if (b) go({ tab: b.dataset.go }); });
$("view").addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return; const d = t.dataset;
  if ("soon" in d) return toast("데모에서는 지원하지 않는 메뉴입니다");
  if (d.go) return go({ tab: d.go });
  if (d.order) return go({ tab: "market", page: "order", sym: d.order, side: "buy" });
  if (d.side) return go({ ...route, side: d.side });
  if (d.page) return go({ tab: "wallet", page: d.page });
  if (d.asset) return go({ tab: "wallet", page: "asset", sym: d.asset });
  if (d.wd) return go({ tab: "wallet", page: "withdraw", sym: d.wd });
  if (d.tx) return go({ tab: "wallet", page: "result", txid: d.tx });
  if (d.pct) { const side = route.side || "buy", p = +d.pct / 100;
    $("o-amt").value = side === "buy" ? Math.floor(S.krw * p) : Math.floor(qty(route.sym) * p * 1e8) / 1e8; return calcOrder(); }
  if (d.add) { $("k-amt").value = Math.floor(num($("k-amt").value)) + +d.add; return; }
  switch (t.id) {
    case "o-go": return submitOrder();
    case "o-reset": $("o-amt").value = ""; $("o-err").textContent = ""; return calcOrder();
    case "k-go": return submitKrw();
    case "w-go": return submitWd();
    case "w-max": { const w = wdVals(); $("w-amt").value = Math.max(0, Math.floor((qty(w.c.s) - w.net.fee) * 1e8) / 1e8); return calcWd(); }
    case "w-sample": $("w-addr").value = sampleAddr($("w-net").value); if ($("w-tag")) $("w-tag").value = Math.floor(1e8 + Math.random() * 9e8);
      return toast("형식만 맞춘 가짜 주소입니다 (연습용)");
    case "r-copy": { const tx = $("r-tx").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(tx) : Promise.reject()).then(() => toast("TXID를 복사했습니다"), () => toast("복사할 수 없습니다. 직접 선택해 복사하세요")); return; }
    case "reset": if (confirm("모의 잔고와 내역을 모두 지울까요?")) { S = fresh(); save(); render(); toast("초기화했습니다"); } return;
  }
});
$("view").addEventListener("input", ev => { document.querySelectorAll("#view .err").forEach(e => e.textContent = ""); if (ev.target.id === "o-amt") calcOrder();
  if (ev.target.id === "m-q") { route.q = ev.target.value; $("m-list").innerHTML = marketRows(); }
  if (ev.target.id === "w-q" || ev.target.id === "w-f") { route.q = $("w-q").value; route.f = $("w-f").value; $("w-list").innerHTML = walletRows(); } if (/^w-(amt|net)$/.test(ev.target.id)) calcWd(); });

/* ---------- 가상 시세 ---------- */
setInterval(() => {
  COINS.forEach(c => {
    const vol = c.s === "USDT" ? 0.0004 : 0.0025;
    let p = price[c.s] * (1 + (Math.random() - .5) * 2 * vol);
    price[c.s] = Math.min(base[c.s] * 1.3, Math.max(base[c.s] * 0.7, p));
    const g = chg(c.s);
    document.querySelectorAll(`[data-p="${c.s}"]`).forEach(e => { e.textContent = fp(price[c.s]); e.className = e.className.replace(/\b(up|down)\b/g, "").trim() + " " + g.cls; });
    document.querySelectorAll(`[data-c="${c.s}"]`).forEach(e => { e.textContent = g.pct.toFixed(2) + "%"; e.className = e.className.replace(/\b(up|down)\b/g, "").trim() + " " + g.cls; });
    document.querySelectorAll(`[data-d="${c.s}"]`).forEach(e => { e.textContent = fd(g.d); });
    document.querySelectorAll(`[data-k="${c.s}"]`).forEach(e => { e.className = "cdl " + g.cls; });
    document.querySelectorAll(`[data-v="${c.s}"]`).forEach(e => { e.textContent = won(qty(c.s) * price[c.s]) + " KRW"; });
  });
  const ev = totalEval();
  if ($("m-ev")) { $("m-ev").textContent = won(ev); const pl = ev - totalBuy(); $("m-pl").textContent = won(pl); const k = pl > 0 ? "up" : pl < 0 ? "down" : "", by = totalBuy();
    $("m-pl").className = k; $("m-r").className = k; $("m-r").textContent = (by ? pl / by * 100 : 0).toFixed(2) + "%"; }
  if ($("w-tot")) $("w-tot").textContent = won(S.krw + ev);
  if (route.page === "order") { calcOrder(); if ($("ob")) $("ob").innerHTML = obHtml(route.sym); }
}, 1500);

drawPin(); settle(); render();
</script>
</body>
</html>
