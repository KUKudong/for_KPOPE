<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#dfe9e4">
<title>새싹뱅크 (모의 학습용)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="새싹뱅크">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#e6eeea; --card:#fff; --ink:#16191d; --sub:#6b7480; --line:#e3e8ee;
  --brand:#0b6b4a; --brand-soft:#e9f4ef; --plus:#2f6bff; --chip:#cfdcd6; --red:#f04452;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#cfd6d3;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.mockbar{padding-top:calc(5px + env(safe-area-inset-top));background:#16191d;color:#fff;font-size:12px;text-align:center;padding:5px 8px;letter-spacing:-.2px;flex:none}
.screen{flex:1;overflow-y:auto;display:none;flex-direction:column}
.screen.on{display:flex}
.white{background:#fff}
/* header */
.top{display:flex;align-items:center;padding:18px 20px 14px;gap:10px;flex:none}
.top h1{font-size:24px;margin:0;flex:1;letter-spacing:-.5px}
.chip{background:var(--chip);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:600;color:#3d4a45}
.chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#3d4a45;margin-right:5px;vertical-align:middle}
.bell{position:relative;width:28px;height:28px}
.bell svg{width:26px;height:26px}
.badge{position:absolute;top:-7px;right:-8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 5px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;flex:none}
.nav button{font-size:16px}
.back svg{width:26px;height:26px;display:block}
/* cards */
.pad{padding:0 16px 20px}
.card{background:var(--card);border-radius:22px;margin-bottom:12px;overflow:hidden}
.notice{display:flex;align-items:center;gap:14px;padding:18px 20px}
.notice .ic{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;flex:none}
.notice small{display:block;color:var(--sub);font-size:13px}
.notice b{font-size:15px}
.notice .x{margin-left:auto;color:var(--sub);font-size:20px}
.acct{padding:20px}
.acct .nm{font-size:15px;display:flex;align-items:center;gap:6px}
.acct .nm span{color:var(--sub)}
.acct .bal{font-size:26px;font-weight:800;margin:8px 0 18px;letter-spacing:-.5px}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:13px 0;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:16px;font-weight:500}
.btn.fill{background:var(--brand);color:#fff}
.btn:active{filter:brightness(.95)}
.promo{display:flex;gap:14px;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.rnd{width:44px;height:44px;border-radius:50%;background:#eef2f5;display:grid;place-items:center;flex:none;font-size:20px}
.promo small{color:var(--sub);font-size:13px;display:block}
.promo b{font-size:16px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);padding:18px 8px 16px;text-align:center}
.quick button{font-size:13px}
.quick .q{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 8px;font-size:22px;position:relative}
.sec h2{font-size:19px;margin:0;padding:22px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.sec h2 button{font-size:14px;color:var(--sub);font-weight:400}
.sec h3{font-size:15px;margin:0;padding:14px 20px 4px}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px;width:100%;text-align:left}
.row small{color:#444;font-size:14px;display:block}
.row b{font-size:18px}
.row .go{margin-left:auto;border:1px solid #c9d1d9;border-radius:9px;padding:7px 13px;font-size:15px}
.more{display:block;width:100%;padding:18px;border-top:1px solid var(--line);color:#555;font-size:16px;margin-top:10px}
.foot{text-align:center;color:var(--sub);font-size:14px;padding:16px 0 28px}
/* tab bar */
.tabs{padding-bottom:calc(12px + env(safe-area-inset-bottom)) !important;display:flex;background:#fff;border-radius:18px 18px 0 0;padding:8px 0 12px;flex:none;box-shadow:0 -1px 0 var(--line)}
.tabs button{flex:1;font-size:11px;color:#9aa5b1}
.tabs button.on{color:var(--brand);font-weight:700}
/* account detail */
.detail-h{padding:6px 20px 20px}
.detail-h h2{font-size:24px;margin:0 0 4px}
.detail-h .no{color:var(--sub);font-size:16px}
.detail-h .bal{text-align:right;font-size:30px;font-weight:800;margin:26px 0 24px}
.four{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:22px 8px;font-size:13px;color:#8a94a0}
.four .q{width:40px;height:40px;border-radius:12px;background:#f1f4f7;margin:0 auto 8px;display:grid;place-items:center;font-size:18px}
.gap{height:14px;background:#f2f4f6;flex:none}
.filter{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#555;font-size:14px}
.filter .s{width:32px;height:32px;border:1px solid #c9d1d9;border-radius:50%;display:grid;place-items:center}
.tx{padding:16px 0;margin:0 20px;border-bottom:1px solid var(--line)}
.tx .d{font-size:13px;color:#555}
.tx .d i{font-style:normal;color:#8a94a0;border-left:1px solid #d5dbe1;margin-left:6px;padding-left:6px}
.tx .l{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.tx .l span{font-size:16px;font-weight:500}
.tx .l b{font-size:22px;font-weight:700;letter-spacing:-.2px}
.tx .l b.in{color:var(--plus)}
.tx .r{text-align:right;color:#666;font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:50px 0;font-size:15px}
/* flow */
.flow{padding:8px 20px 20px;flex:1;display:flex;flex-direction:column}
.flow h2{font-size:23px;line-height:1.35;margin:6px 0 20px;letter-spacing:-.5px}
.flow h2 em{font-style:normal;color:var(--brand)}
.lbl{font-size:13px;color:var(--sub);margin:14px 0 6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;text-align:left;border-bottom:1px solid var(--line)}
.opt small{display:block;color:var(--sub);font-size:13px}
.field{width:100%;border:0;border-bottom:2px solid var(--line);padding:10px 2px;font-size:18px;outline:none;background:none}
.field:focus{border-color:var(--brand)}
.amt{font-size:34px;font-weight:800;min-height:46px;letter-spacing:-.5px}
.amt.ph{color:#c2c9d1}
.hint{font-size:14px;color:var(--sub);margin-top:6px;min-height:20px}
.hint.err{color:var(--red)}
.quickamt{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.quickamt button{background:#f1f4f7;border-radius:8px;padding:8px 11px;font-size:14px}
.pad-k{display:grid;grid-template-columns:repeat(3,1fr);margin-top:auto;padding-top:14px}
.pad-k button{padding:15px 0;font-size:24px;font-weight:500;border-radius:12px}
.pad-k button:active{background:#f1f4f7}
.cta{width:100%;padding:16px;border-radius:12px;background:var(--brand);color:#fff;font-size:17px;font-weight:600;margin-top:12px}
.cta:disabled{background:#cfd6dc}
.cta.ghost{background:#f1f4f7;color:var(--ink)}
.sum{background:#f6f8fa;border-radius:14px;padding:6px 16px;margin-top:8px}
.sum div{display:flex;justify-content:space-between;padding:11px 0;font-size:15px}
.sum div span{color:var(--sub)}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done .ok{width:68px;height:68px;border-radius:50%;background:var(--brand);color:#fff;font-size:36px;display:grid;place-items:center;margin-bottom:20px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(22,25,29,.92);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:9}
.toast.on{opacity:1}
.set{padding:0 20px 20px}
.set p{color:var(--sub);font-size:14px;line-height:1.5}
.top{position:sticky;top:0;z-index:3;background:#dbe6e1}
.acct{position:relative}
.acct .dots{position:absolute;right:18px;top:18px;font-size:22px;color:#555;line-height:1}
.pager{text-align:center;padding:0 0 14px}
.pager i{display:inline-block;width:6px;height:6px;border-radius:50%;border:1px solid #6b7480;margin:0 4px}
.pager i.on{background:#4a5560;border-color:#4a5560}
.quick{position:relative;overflow:visible;padding-bottom:26px}
.quick::after{content:"";position:absolute;left:50%;bottom:12px;width:30px;height:4px;margin-left:-15px;border-radius:2px;background:linear-gradient(90deg,#4a5560 75%,#c9d1d9 75%)}
.quick .rec{position:absolute;right:-8px;bottom:-4px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px}
.bubble{position:absolute;right:14px;top:-10px;background:#fff;border-radius:12px;padding:3px 9px;font-size:12px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.row .xx{margin-left:auto;width:24px;height:24px;border-radius:50%;background:#e6ebf0;font-size:11px;color:#555}
.divider{border-top:1px solid var(--line);margin-top:22px}
.recs{padding:22px 16px 20px}
.recs small{color:var(--sub);font-size:14px;padding:0 4px}
.recs h2{font-size:18px;margin:4px 0 16px;padding:0 4px}
.recs .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.recs .g button{background:#f6f8fa;border-radius:16px;padding:10px 6px 18px;text-align:center}
.recs .rk{display:block;text-align:left;font-size:11px;font-weight:700;color:var(--brand);margin-left:4px}
.recs .em{font-size:30px;display:block;margin:6px 0 8px}
.recs b{display:block;font-size:15px;margin-bottom:4px}
.recs span.t{font-size:13px;color:var(--sub);line-height:1.4;display:block}
.fb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#d3dbd7;border-radius:18px;padding:16px 20px;margin-bottom:12px}
.fb small{display:block;color:#555;font-size:13px}.fb b{font-size:15px}.fb .ar{margin-left:auto;font-size:18px;color:#444}
.tabs svg{display:block;width:26px;height:26px;margin:0 auto 3px}
</style>
</head>
<body>
<div id="app">
  <div class="mockbar">모의 학습용 앱 · 실제 은행이 아니며 실제 돈이 움직이지 않습니다</div>

  <!-- 홈 -->
  <section class="screen on" id="s-home">
    <div class="top">
      <h1>홈</h1>
      <span class="chip">학생</span>
      <button class="bell" data-toast="새 알림이 없어요">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16191d" stroke-width="1.8"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15L6 17Z"/><path d="M10 21h4"/></svg>
        <span class="badge" id="badge">1</span>
      </button>
    </div>
    <div class="pad">
      <div class="card notice" id="notice">
        <div class="ic">?</div>
        <div><small>새로워진 새싹뱅크 홈</small><b><span class="uname"></span>님의 의견이 궁금해요</b></div>
        <button class="x" id="noticeX">✕</button>
      </div>

      <div class="card">
        <button class="acct" style="display:block;width:100%;text-align:left" data-go="acct">
          <div class="nm">MY 입출금통장 <span class="mainNo"></span> <span>⧉</span></div><span class="dots">⋮</span>
          <div class="bal" id="homeBal">0원</div>
        </button>
        <div class="btns" style="padding:0 20px 20px;margin-top:-20px">
          <button class="btn" data-act="pull">가져오기</button>
          <button class="btn" data-act="send">이체하기</button>
        </div>
        <button class="promo" style="width:100%;text-align:left" data-toast="모의 앱에서는 카드를 발급하지 않아요">
          <div class="rnd">💳</div>
          <div><small>골라받는 역대급 혜택</small><b>체크카드 신청하기</b></div>
        </button>
        <div class="pager"><i class="on"></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="card quick">
        <button data-go="acct"><div class="q">🪙</div>내 자산</button>
        <button data-toast="자동이체는 다음 수업에서 배워요"><div class="q">🗓️</div>자동이체</button>
        <button data-act="allowance"><div class="q">⚡</div>자동충전</button>
        <button data-toast="모의 앱에서는 결제 기능이 없어요"><div class="q">📱<span class="rec">추천</span></div>새싹페이</button>
        <span class="bubble">연습 혜택</span>
      </div>

      <div class="card sec">
        <h2>내 자산 <button data-go="set">편집 ⚙</button></h2>
        <h3>계좌</h3>
        <div id="assetRows"></div>
        <div class="row" id="oldRow"><div class="rnd">💠</div><button data-act="send" style="text-align:left"><small>보낸지 오래된 계좌 찾고</small><b>이체하기</b></button><button class="xx" id="oldX">✕</button></div>
        <div class="divider"></div>
        <h3 style="padding-top:22px">대출</h3>
        <button class="row" data-toast="모의 대출은 다음 수업에서 배워요"><div class="rnd">🧾</div><div><small>모의 연습대출</small><b>0원</b></div></button>
        <button class="more" data-go="acct">내 자산 모두 보기 ›</button>
      </div>

      <div class="card recs">
        <small><span class="uname"></span>님을 위한</small>
        <h2>실시간 추천 서비스예요</h2>
        <div class="g">
          <button data-toast="모의 앱에서는 카드를 발급하지 않아요"><span class="rk">1위</span><span class="em">💳</span><b>연습카드</b><span class="t">수업용<br>체크카드 체험</span></button>
          <button data-sendto="exch"><span class="rk">2위</span><span class="em">🏠</span><b>모의 거래소</b><span class="t">쉽고 편리한<br>가상자산 연습</span></button>
          <button data-act="pull"><span class="rk">3위</span><span class="em">🧳</span><b>연습 저금통</b><span class="t">모아둔 돈<br>가져오기</span></button>
        </div>
      </div>

      <button class="fb" data-toast="의견은 선생님께 말해 주세요"><span style="font-size:20px">✎</span><div><small>새로워진 새싹뱅크 홈</small><b><span class="uname"></span>님의 의견이 궁금해요</b></div><span class="ar">›</span></button>

      <div class="foot"><button data-toast="간편 홈 모드는 준비 중이에요">간편 홈 모드</button> &nbsp;&nbsp;|&nbsp;&nbsp; <button data-go="set">홈 화면 설정</button></div>
    </div>
  </section>

  <!-- 계좌 상세 -->
  <section class="screen white" id="s-acct">
    <div class="nav"><button class="back" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="#16191d" stroke-width="2"><path d="M15 4 7 12l8 8"/></svg></button><button data-go="set">관리</button></div>
    <div class="detail-h">
      <h2>MY 입출금통장</h2>
      <button class="no" id="copyNo"><span class="mainNo"></span> ⧉</button>
      <div class="bal" id="acctBal">0원</div>
      <div class="btns">
        <button class="btn" style="padding:16px 0" data-act="pull">가져오기</button>
        <button class="btn fill" style="padding:16px 0" data-act="send">이체하기</button>
      </div>
      <div class="four">
        <button data-act="pull"><div class="q">👛</div>저금통</button>
        <button data-toast="입출금리워드는 모의 앱에 없어요"><div class="q">⭐</div>입출금리워드</button>
        <button data-toast="모의 앱에서는 카드를 발급하지 않아요"><div class="q">💳</div>체크카드</button>
        <button data-act="allowance"><div class="q">⚡</div>자동충전</button>
      </div>
    </div>
    <div class="gap"></div>
    <div class="filter"><span class="s">🔍</span><span>3개월 · 입출금 · 최신순 ⌄</span></div>
    <div id="txList"></div>
  </section>

  <!-- 이체/가져오기 흐름 -->
  <section class="screen white" id="s-flow">
    <div class="nav"><button class="back" id="flowBack"><svg viewBox="0 0 24 24" fill="none" stroke="#16191d" stroke-width="2"><path d="M15 4 7 12l8 8"/></svg></button><button data-go="home">취소</button></div>
    <div class="flow" id="flowBody"></div>
  </section>

  <!-- 설정 -->
  <section class="screen white" id="s-set">
    <div class="nav"><button class="back" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="#16191d" stroke-width="2"><path d="M15 4 7 12l8 8"/></svg></button><span></span></div>
    <div class="set">
      <h2 style="margin:0 0 6px">관리</h2>
      <div class="lbl">내 이름</div>
      <input class="field" id="nameIn" maxlength="10" placeholder="이름을 입력하세요">
      <button class="cta" id="saveName">이름 저장</button>
      <button class="cta ghost" data-act="allowance">연습용 용돈 100만원 받기</button>
      <button class="cta ghost" id="reset" style="color:var(--red)">처음부터 다시 시작</button>
      <p>이 앱은 금융 수업을 위한 모의 앱입니다. 모든 금액은 가상의 연습용 돈이며, 기록은 이 기기의 브라우저에만 저장됩니다.</p>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="on" data-go="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1Z"/></svg>홈</button>
    <button data-toast="상품 탭은 준비 중이에요"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 8h14l1 12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Zm4 0V6a3 3 0 0 1 6 0v2" fill-rule="evenodd"/></svg>상품</button>
    <button data-toast="혜택 탭은 준비 중이에요"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h8v4H3Zm10 0h8v4h-8ZM4.5 14.5H11V21H5.5a1 1 0 0 1-1-1Zm8.5 0h6.500V20a1 1 0 0 1-1 1H13ZM12 8S9 3 7 5s5 3 5 3 3-5 5-3-5 3-5 3Z"/></svg>혜택</button>
    <button data-toast="서비스 탭은 준비 중이에요"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm6 4.500-1.400 2.900-3.100.400 2.300 2.200-.600 3.100 2.800-1.500 2.800 1.500-.600-3.100 2.300-2.200-3.100-.400Z" fill-rule="evenodd"/></svg>서비스</button>
    <button data-go="set"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.500h16v2.500H4Zm0 5.250h16v2.500H4Zm0 5.250h16v2.500H4Z"/></svg>전체</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
'use strict';
var KEY='saessak-mockbank-v2';
var ACC={
  main:{name:'MY 입출금통장',icon:'🌱'},
  piggy:{name:'연습 저금통',icon:'👛'},
  exch:{name:'모의 코인거래소 연결계좌',icon:'🪙'}
};
function rnd(n){var s='';for(var i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s}
function fresh(){
  var now=Date.now(),H=3600000,D=24*H;
  /* 더미 입출금 내역: [며칠 전, 시, 분, 이름, 금액] (오래된 것부터) */
  var seed=[
    [24,9,12,'엄마 용돈',50000],[23,16,40,'행복편의점',-2800],[22,12,35,'맛나분식',-5500],
    [21,3,19,'이자',14],[20,18,5,'김하늘',-10000],[18,15,22,'별빛문구',-4200],
    [17,10,3,'할머니',100000],[17,10,30,'연습 저금통',-50000],[15,13,48,'새싹서점',-13500],
    [13,17,26,'이도윤',8000],[12,8,15,'교통카드 충전',-10000],[10,19,2,'달콤베이커리',-3900],
    [8,9,0,'엄마 용돈',50000],[7,16,11,'행복편의점',-1700],[6,14,8,'박서연',-15000],
    [4,12,44,'맛나분식',-6000],[3,20,31,'아빠',30000],[2,11,51,'모의 코인거래소 연결계좌',-50000],
    [0,0,0,'선생님(연습용 용돈)',1000000]
  ];
  var bal=0,tx=[],day=new Date(now);day.setHours(0,0,0,0);
  seed.forEach(function(r){
    bal+=r[4];
    var t=r[0]?day.getTime()-r[0]*D+r[1]*H+r[2]*60000:now;
    tx.unshift({t:t,who:r[3],amt:r[4],bal:bal});
  });
  return {name:'학생',notice:true,no:'777-'+rnd(3)+'-'+rnd(6),
    bal:{main:bal,piggy:350000,exch:50000},tx:tx};
}
var S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.bal)S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function won(n){return n.toLocaleString('ko-KR')+'원'}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function p2(n){return (n<10?'0':'')+n}

var toastT;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},1800)}

function go(name){
  ['home','acct','flow','set'].forEach(function(s){$('s-'+s).classList.toggle('on',s===name)});
  $('tabs').style.display=(name==='home')?'flex':'none';
  $('s-'+name).scrollTop=0;
  render();
}

function addTx(who,amt){
  S.bal.main+=amt;
  S.tx.unshift({t:Date.now(),who:who,amt:amt,bal:S.bal.main});
}

function render(){
  document.querySelectorAll('.uname').forEach(function(e){e.textContent=S.name});
  document.querySelectorAll('.mainNo').forEach(function(e){e.textContent=S.no});
  $('homeBal').textContent=won(S.bal.main);
  $('acctBal').textContent=won(S.bal.main);
  $('notice').style.display=S.notice?'flex':'none';
  $('badge').style.display=S.notice?'block':'none';
  $('oldRow').style.display=S.old===false?'none':'flex';
  $('nameIn').value=S.name;
  $('assetRows').innerHTML=['piggy','exch'].map(function(k){
    return '<div class="row"><div class="rnd">'+ACC[k].icon+'</div><div><small>'+ACC[k].name+'</small><b>'+won(S.bal[k])+'</b></div>'+
      '<button class="go" data-sendto="'+k+'">이체</button></div>';
  }).join('');
  $('txList').innerHTML=S.tx.length?S.tx.map(function(x){
    var d=new Date(x.t);
    return '<div class="tx"><div class="d">'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+'<i>'+p2(d.getHours())+':'+p2(d.getMinutes())+'</i></div>'+
      '<div class="l"><span>'+esc(x.who)+'</span><b class="'+(x.amt>0?'in':'')+'">'+(x.amt>0?'+':'')+won(x.amt)+'</b></div>'+
      '<div class="r">잔액 '+won(x.bal)+'</div></div>';
  }).join(''):'<div class="empty">거래 내역이 없어요</div>';
}

/* ---------- 이체 / 가져오기 흐름 ---------- */
var F=null;
function startFlow(mode,to){
  F={mode:mode,step:'who',to:null,amt:''};
  if(mode==='pull'){F.to={key:'piggy',label:ACC.piggy.name};F.step='amt'}
  if(to){F.to={key:to,label:ACC[to].name};F.step='amt'}
  go('flow');drawFlow();
}
function srcBal(){return F.mode==='pull'?S.bal.piggy:S.bal.main}
function drawFlow(){
  var b=$('flowBody'),h='';
  if(F.step==='who'){
    h='<h2>누구에게 보낼까요?</h2><div class="lbl">내 계좌</div>'+
      ['piggy','exch'].map(function(k){return '<button class="opt" data-pick="'+k+'"><div class="rnd">'+ACC[k].icon+'</div><div>'+ACC[k].name+'<small>'+won(S.bal[k])+'</small></div></button>'}).join('')+
      '<div class="lbl" style="margin-top:22px">친구에게 보내기 (연습)</div>'+
      '<input class="field" id="fName" maxlength="10" placeholder="받는 사람 이름">'+
      '<input class="field" id="fNo" inputmode="numeric" maxlength="16" placeholder="계좌번호 (아무 숫자나 연습)">'+
      '<div style="margin-top:auto"><button class="cta" id="fNext">다음</button></div>';
  }else if(F.step==='amt'){
    var n=Number(F.amt||0),over=n>srcBal();
    h='<h2>'+(F.mode==='pull'?'<em>'+esc(F.to.label)+'</em>에서<br>얼마를 가져올까요?':'<em>'+esc(F.to.label)+'</em>'+(F.to.key?'(으)로':'님에게')+'<br>얼마를 보낼까요?')+'</h2>'+
      '<div class="amt'+(n?'':' ph')+'">'+(n?won(n):'금액 입력')+'</div>'+
      '<div class="hint'+(over?' err':'')+'">'+(over?'잔액이 부족해요 · ':'')+'출금 가능 '+won(srcBal())+'</div>'+
      '<div class="quickamt"><button data-add="10000">+1만</button><button data-add="50000">+5만</button><button data-add="100000">+10만</button><button data-add="all">전액</button></div>'+
      '<div class="pad-k">'+['1','2','3','4','5','6','7','8','9','00','0','←'].map(function(k){return '<button data-k="'+k+'">'+k+'</button>'}).join('')+'</div>'+
      '<button class="cta" id="fNext"'+(n>0&&!over?'':' disabled')+'>다음</button>';
  }else if(F.step==='ok'){
    var a=Number(F.amt);
    h='<h2><em>'+esc(F.to.label)+'</em>'+(F.mode==='pull'?'에서':(F.to.key?'(으)로':'님에게'))+'<br>'+won(a)+'을 '+(F.mode==='pull'?'가져올까요?':'보낼까요?')+'</h2>'+
      '<div class="sum"><div><span>'+(F.mode==='pull'?'가져올 곳':'받는 분')+'</span><b>'+esc(F.to.label)+'</b></div>'+
      (F.to.no?'<div><span>계좌번호</span><b>'+esc(F.to.no)+'</b></div>':'')+
      '<div><span>출금 계좌</span><b>'+(F.mode==='pull'?ACC.piggy.name:ACC.main.name)+'</b></div>'+
      '<div><span>수수료</span><b>0원</b></div></div>'+
      '<div style="margin-top:auto"><button class="cta" id="fDo">'+(F.mode==='pull'?'가져오기':'이체하기')+'</button></div>';
  }else{
    h='<div class="done"><div class="ok">✓</div><h2 style="margin:0 0 8px">'+won(Number(F.amt))+'</h2>'+
      '<div style="color:var(--sub)">'+esc(F.to.label)+(F.mode==='pull'?'에서 가져왔어요':(F.to.key?'(으)로 보냈어요':'님에게 보냈어요'))+'</div></div>'+
      '<button class="cta" data-go="acct">거래내역 보기</button><button class="cta ghost" data-go="home">확인</button>';
  }
  b.innerHTML=h;
}
function flowBack(){
  if(!F||F.step==='done'||F.step==='who')return go('home');
  if(F.step==='ok'){F.step='amt';return drawFlow()}
  if(F.step==='amt'){if(F.mode==='pull'||F.fixed)return go('home');F.step='who';F.amt='';return drawFlow()}
}
function execFlow(){
  var a=Number(F.amt);
  if(!(a>0)||a>srcBal())return toast('잔액을 확인해 주세요');
  if(F.mode==='pull'){S.bal.piggy-=a;addTx(F.to.label,a)}
  else{if(F.to.key)S.bal[F.to.key]+=a;addTx(F.to.label,-a)}
  save();F.step='done';drawFlow();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  var d=t.dataset;
  if(d.toast)return toast(d.toast);
  if(d.go)return go(d.go);
  if(d.sendto){startFlow('send',d.sendto);F.fixed=true;return}
  if(d.act==='send')return startFlow('send');
  if(d.act==='pull')return startFlow('pull');
  if(d.act==='allowance'){addTx('선생님(연습용 용돈)',1000000);save();render();return toast('연습용 돈 100만원이 충전됐어요')}
  if(d.pick){F.to={key:d.pick,label:ACC[d.pick].name};F.step='amt';return drawFlow()}
  if(d.k){
    if(d.k==='←')F.amt=F.amt.slice(0,-1);
    else if(!(F.amt===''&&(d.k==='0'||d.k==='00'))&&(F.amt+d.k).length<=10)F.amt+=d.k;
    return drawFlow();
  }
  if(d.add){F.amt=String(d.add==='all'?srcBal():Number(F.amt||0)+Number(d.add));if(F.amt==='0')F.amt='';return drawFlow()}
  if(t.id==='fNext'){
    if(F.step==='who'){
      var nm=$('fName').value.trim(),no=$('fNo').value.replace(/[^0-9]/g,'');
      if(!nm)return toast('받는 사람 이름을 입력해 주세요');
      if(no.length<6)return toast('계좌번호를 6자리 이상 입력해 주세요');
      F.to={key:null,label:nm,no:no};F.step='amt';
    }else F.step='ok';
    return drawFlow();
  }
  if(t.id==='fDo')return execFlow();
  if(t.id==='flowBack')return flowBack();
  if(t.id==='oldX'){S.old=false;save();return render()}
  if(t.id==='noticeX'){S.notice=false;save();return render()}
  if(t.id==='copyNo'){if(navigator.clipboard)navigator.clipboard.writeText(S.no).catch(function(){});return toast('계좌번호를 복사했어요')}
  if(t.id==='saveName'){var v=$('nameIn').value.trim();if(!v)return toast('이름을 입력해 주세요');S.name=v;save();toast('저장했어요');return go('home')}
  if(t.id==='reset'){if(t.dataset.sure){delete t.dataset.sure;t.textContent='처음부터 다시 시작';S=fresh();save();toast('처음 상태로 돌아갔어요');return go('home')}t.dataset.sure='1';t.textContent='한 번 더 누르면 모든 기록이 지워져요';setTimeout(function(){delete t.dataset.sure;t.textContent='처음부터 다시 시작'},4000)}
});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'||location.hostname==='localhost')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
